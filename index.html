<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JoyLabz Experiments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #8fd3ff; --dot: #b5e3ff; --ink: #1d2340; --card: #ffffff; --muted: #5a6180;
    --c1: #ff6b6b; --c2: #ffd93d; --c3: #6bcB77; --c4: #4d96ff; --c5: #c77dff; --c6: #ff9f45;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    font-family: Nunito, system-ui, sans-serif;
    background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 18%, transparent 19%);
    background-size: 28px 28px;
  }
  header { text-align: center; padding: 40px 16px 8px; }
  h1 { font-family: Fredoka, sans-serif; font-size: clamp(36px, 7vw, 64px); margin: 0;
       color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; letter-spacing: 1px; }
  header p { margin: 8px 0 0; font-weight: 700; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px;
         display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .card { background: var(--card); border: 4px solid var(--ink); border-radius: 22px;
          box-shadow: 6px 6px 0 var(--ink); overflow: hidden; display: flex; flex-direction: column;
          transition: transform .15s cubic-bezier(.3,1.8,.5,1); }
  .card:hover { transform: translateY(-4px) rotate(-1deg); }
  .band { aspect-ratio: 16 / 10; overflow: hidden; border-bottom: 4px solid var(--ink); }
  .band img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  h2 { font-family: Fredoka, sans-serif; margin: 0; font-size: 24px; }
  .desc { margin: 0; color: var(--muted); flex: 1; }
  .btns { display: flex; gap: 10px; }
  .btn { font-family: Fredoka, sans-serif; font-size: 18px; text-decoration: none; color: var(--ink);
         border: 3px solid var(--ink); border-radius: 14px; padding: 6px 16px; box-shadow: 3px 3px 0 var(--ink); }
  .btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }
  .play { background: var(--c2); flex: 1; text-align: center; }
  .code { background: #eef1ff; }
  .nodemo { font-size: 14px; color: var(--muted); align-self: center; flex: 1; }
  footer { text-align: center; padding-bottom: 30px; font-weight: 700; }
  footer a { color: var(--ink); }
</style>
</head>
<body>
<header>
  <h1>JoyLabz Experiments</h1>
</header>
<main id="grid"></main>
<footer><a href="https://github.com/wakeupsilver">github.com/wakeupsilver</a></footer>

<script>
const USER = 'wakeupsilver';
// Repos to leave off the shelf (this page itself and anything else you don't want shown).
const HIDE = ['wakeupsilver.github.io', 'wordcloud'];   // wordcloud: a fork whose live page is blank
// Optional nicer names. Card pictures come from shots/<repo>.jpg. Repos not listed here still show up automatically.
const EXTRA = {
  'top-ensemble':              { title: 'Top Ensemble' },
  'frac-a-mole':               { title: 'Frac-a-Mole' },
  'sips':                      { title: 'Sips' },
  'flow-lab':                  { title: 'Flow Lab' },
  'body-rave':                 { title: 'Dance the Music' },
  'disco-scratch':             { title: 'Disco Scratch' },
  'recursive-scratch':         { title: 'Recursive Scratch' },
  'octostudio-scratch':        { title: 'OctoStudio for Scratch' },
  'disco-logo':                { title: 'Disco Logo' },
  '1derworld':                 { title: '1derworld' },
  'mad-libs-piano':            { title: 'Mad Libs Piano' },
  'mania-arena':               { title: 'Mania Arena' },
  'morph-lab':                 { title: 'Morph Lab' },
  'image-quilter':             { title: 'Image Quilter' },
  'bonkworks':                 { title: 'Bonkworks' },
  'scratch-portfolio-bedroom': { title: 'Scratch Portfolio Bedroom' },
  'text-graph-convos':         { title: 'Conversation Universe' },
  'tic-tac-mania':             { title: 'Tic-Tac-Mania' },
  'Visual-convos':             { title: 'Visual Convos' },
};
// Projects living in a folder of this site instead of their own repo (shown unless a repo of that name exists).
const MANUAL = [
  { name: 'frac-a-mole', has_pages: false, homepage: 'https://wakeupsilver.github.io/frac-a-mole/', pushed_at: '2026-11-18T19:05:00Z', fork: false,
    description: 'Frac-a-Mole: fractal whack-a-mole for Makey Makey. Whack a mole, dive into its hole, four more are waiting. Forever.' },
  { name: 'top-ensemble', has_pages: false, homepage: 'https://wakeupsilver.github.io/top-ensemble/', pushed_at: '2026-11-18T19:00:00Z', fork: false,
    description: 'Top Ensemble: spin a top across a table and the camera turns it into a conductor for a 12-piece circus band. A gift for AnnMarie Thomas.' },
];
// Used only if GitHub can't be reached (offline, rate limit).
const FALLBACK = [
  ['top-ensemble', true, 'Top Ensemble: spin a top across a table and the camera turns it into a conductor for a 12-piece circus band. A gift for AnnMarie Thomas.'],
  ['frac-a-mole', true, 'Frac-a-Mole: fractal whack-a-mole for Makey Makey. Whack a mole, dive into its hole, four more are waiting. Forever.'],
  ['sips', true, 'A breathing game: sips, box breathing and three rounds of "Wim Hof" style breathing, played with your own breath.'],
  ['body-rave', true, 'Dance the Music: your dance makes the music go. Trigger sound effects and control the music with your body, breathing and heart rate. Nothing leaves your browser.'],
  ['disco-scratch', true, 'Disco Scratch: a neon-disco block-coding editor that runs inside Scratch, with nesting blocks, threads, custom blocks and 12 extensions.'],
  ['recursive-scratch', true, 'Scratch, inside Scratch, inside Scratch: a block editor and VM built from Scratch blocks, running its own mini Scratch.'],
  ['octostudio-scratch', true, 'An OctoStudio-style coding app rebuilt inside one Scratch project, plus a disco edition.'],
  ['disco-logo', true, 'Disco Logo: a Logo language that runs inside Scratch, with a retro prompt, a turtle and disco mode.'],
  ['flow-lab', true, 'Flow Lab: your pulse, breathing and face signals read live from a plain webcam. Nothing leaves your browser.'],
  ['image-quilter', true, 'Cut up one image and create another out of it'],
  ['morph-lab', true, 'Morph between any two images, nine ways: patch migration, pixel swarm, spectral, liquid and more'],
  ['mania-arena', true, 'Board games on maximum steroids: wrestling tic-tac-toe, chain-reaction four-in-a-row, royal rumble checkers'],
  ['1derworld', true, 'Walk into a taco truck, slide into the sea, and step through portals into my apps'],
  ['mad-libs-piano', true, 'A 25-key piano that sings songs one word per note. Wrong keys sing silly words.'],
  ['text-graph-convos', true, 'Conversation Universe: a two-person conversation drawn as a living night sky of words.'],
  ['bonkworks', true, 'A chain-reaction machine builder: pin parts to a pegboard, press GO, watch it bonk.'],
  ['tic-tac-mania', true, 'Tic-tac-toe on maximum steroids.'],
  ['scratch-portfolio-bedroom', false, "Type any Scratch username and walk into a 3D room built from that person's public projects."],
  ['Visual-convos', true, ''],
].map(([name, has_pages, description]) => ({ name, has_pages, description, fork: false }));

const COLORS = ['--c1','--c2','--c3','--c4','--c5','--c6'];
const hash = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
const pretty = n => n.replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(repos) {
  repos = [...repos, ...MANUAL.filter(m => !repos.some(r => r.name === m.name))];
  const list = repos
    .filter(r => !r.archived && !HIDE.includes(r.name))
    // Most recently published first, so whatever was worked on last is at the top.
    .sort((a, b) => String(b.pushed_at||b.created_at||'').localeCompare(String(a.pushed_at||a.created_at||'')));
  document.getElementById('grid').innerHTML = list.map(r => {
    const x = EXTRA[r.name] || {};
    const h = hash(r.name);
    const live = r.homepage || (r.has_pages ? `https://${USER}.github.io/${r.name}/` : '');
    return `<article class="card">
      <div class="band" style="background:var(${COLORS[h % COLORS.length]})"><img src="shots/${encodeURIComponent(r.name)}.jpg" alt="" loading="lazy" onerror="this.remove()"></div>
      <div class="body">
        <h2>${esc(x.title || pretty(r.name))}</h2>
        <p class="desc">${esc(r.description || '')}</p>
        <div class="btns">
          ${live ? `<a class="btn play" href="${esc(live)}" target="_blank" rel="noopener">▶ Play</a>`
                 : `<span class="nodemo">No live demo yet</span>`}
        </div>
      </div>
    </article>`;
  }).join('');
}

render(FALLBACK);
fetch(`https://api.github.com/users/${USER}/repos?per_page=100&type=owner`)
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(render)
  .catch(() => {});
</script>
</body>
</html>
